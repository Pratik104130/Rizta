<style>
html, body {
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

* {-webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  box-sizing:border-box;margin:0;padding:0;}

:root {
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff;overflow:hidden;}

/* HEADER */
header{position:fixed;top:0;left:0;width:100%;height:56px;padding:10px 14px;background:rgba(0, 0, 0, 0.6);-webkit-backdrop-filter: blur(12px);border-bottom: 1px solid rgba(255, 255, 255, 0.08);z-index:50;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111;transition: transform 0.35s var(--ease-smooth), opacity 0.3s ease;}
header.hide{
transform:translateY(-100%);
opacity:.7;
}
header b{
animation:logoPulse 2s infinite;
}
@keyframes logoPulse{
50%{transform:scale(1.09);}
}
#topDp{width:34px;height:34px;border-radius:50%;object-fit:cover;}
/* PAGES */
.page{display:none;position:absolute;top:50px;left:0;width:100%;height:calc(100vh - 116px);overflow:auto;background:#000;animation: fadeInUp 0.4s ease forwards;transition: 0.35s ease;}

.page.show {opacity: 1;transform: translateY(0) scale(1);pointer-events: auto;}
@keyframes fadeInUp {from { opacity: 0; transform: translateY(20px); }to { opacity: 1; transform: none; }}
.show{display:block;}

@keyframes slide{from{transform:translateX(20px);opacity:.5}to{transform:translateX(0);opacity:1}}
/* STORIES */
#storiesBar{position:fixed;top:10px;left:0;width:100%;height:90px;display:flex;gap:14px;overflow-x:auto;padding:10px;background:#050505;z-index:30;border-top-right-radius: 20px;}

.story{min-width:72px;text-align:center;}

.storyRing{width:62px;height:62px;border-radius:50%;padding:2.3px;  animation: ringPulse 2s infinite ease-in-out;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
@keyframes ringPulse {0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,85,0.7);}
  70% { box-shadow: 0 0 0 12px rgba(255,45,85,0); }}
.storyRing img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000;}


.small{font-size:11px;color:#ccc;margin-top:4px;}
/* HOME */
#home {top: 146px;height: calc(100vh - 206px);overflow: hidden;}
#profile,#chat,#upload,#notify{top:56px;height:calc(100vh - 116px);}




.reelsWrap{position: relative;height: 100%; overflow: hidden;overflow-y: scroll;scroll-snap-type: y mandatory;scroll-behavior: smooth;
-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;     scroll-snap-stop:always;
scroll-behavior: auto;
  
}

.reel{height: 100%;position: relative;scroll-snap-align: start;       /* Snap to the top of each reel */scroll-snap-stop: always;flex-shrink: 0;animation:reelUp .3s ease;
will-change: transform;
transform: translateZ(0);
}
@keyframes reelUp{
from{
opacity:0;
transform:translateY(45px);
}
to{
opacity:1;
transform:none;
}
}
.reel video{width:100%;height:100%;object-fit:cover;
  will-change: transform;}

.overlay{position:absolute;left:10px;right:10px;bottom:18px;animation:slideUp .4s ease;
}
@keyframes slideUp{
from{opacity:0;transform:translateY(23px);}
to{opacity:1;transform:none;}
}
.btn {
  border: none;
  padding: 9px 14px;
  border-radius: 14px;
  background: linear-gradient(45deg, #ff2d55, #ff0066, #ff6a00);
  color: #fff;
  margin-top: 6px;
  font-weight: 600;
  box-shadow: 0 0 16px rgba(255, 45, 85, .35);
  transition: .25s ease;
}

.btn:active {
  transform: scale(.94);
}

.card{background:#121212;margin:10px;padding:12px;border-radius:14px;animation: popIn 0.3s ease;
  position:relative;
overflow:hidden;
}

h3,b{
animation:textFade .45s ease;
}

@keyframes textFade{
from{
opacity:0;
letter-spacing:5px;
}
to{
opacity:1;
letter-spacing:0;
}
}
.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:60%;
height:100%;
}

.inp {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, .06);
  backdrop-filter: blur(12px);
  color: #fff;
  outline: none;
  border: 1px solid rgba(255, 255, 255, .05);
}

/* PROFILE */
.profileTop{text-align:center;padding:15px;}

.profileTop img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #ff2d55;}

#profileBig{
animation:profileGlow 3s infinite ease-in-out;
}

@keyframes profileGlow{
0%,100%{
box-shadow:0 0 0px #ff2d55;
}
50%{
box-shadow:0 0 24px #ff2d55;
}
}
.statRow{display:flex;justify-content:space-around;margin-top:10px;}
.statRow div{text-align:center;}
/* NAV */
.nav{position:fixed;bottom:0;left:0;width:100%;height:60px;background: rgba(10, 10, 10, 0.7);backdrop-filter: blur(15px);box-shadow: 0 -5px 20px rgba(255, 45, 85, 0.08);display:flex;justify-content:space-around;align-items:center;z-index:60;border-top:1px solid #111;}

.nav span {
  font-size: 24px;
  transition: .25s cubic-bezier(.2, .8, .2, 1);
}

.nav span:active {
  transform: translateY(-6px) scale(1.18);
  color: #ff2d55;
  text-shadow: 0 0 14px #ff2d55;
}

/* PROFILE GRID */
#myPosts {display: grid;grid-template-columns: repeat(3, 1fr);gap: 4px;margin-top: 20px;width:70px;
}

.postMini {aspect-ratio: 1/1;width: 100%;object-fit: cover;border-radius: 8px;}

#postsGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 🔥 3 columns */
  gap: 2px;
}

.postItem {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
}

@keyframes heartPop {0% { transform: scale(0); opacity: 0; }40% { transform: scale(1.4); opacity: 1; }100% { transform: scale(1); opacity: 0; }}

.heart {animation: heartPop 0.6s ease;filter: drop-shadow(0 0 10px red);}


@keyframes popIn {from { transform: scale(0.5); opacity: 0; }to { transform: scale(1); opacity: 1; }}


#storyProgress div {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.3);
  overflow: hidden;
  border-radius: 10px;
}

#storyProgress div span {
  display: block;
  height: 100%;
  width: 0%;
  background: #fff;
}

#storyViewer{
animation:zoomIn .25s ease;
}
@keyframes zoomIn{
from{opacity:0;transform:scale(.92);}
to{opacity:1;transform:scale(1);}
}

.small {
  font-size: 11px;
  color: #D2D2D2;
  margin-left: -7px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width:600px) {
  .overlay {
    bottom: 65px;
  }
  
  .nav {
    height: 60px;
    bottom: 3px;
  }
}


.chatContainer {
  height: calc(100vh - 230px);
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chatInputArea {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  gap: 10px;
  margin-bottom: 3.5rem;
  padding: 10px;
  background: #111;
  border-top: 1px solid #222;
  z-index: 999;
}

.chatInputArea input {
  flex: 1;
  padding: 10px;
  border: none;

  border-radius: 10px;
  background: #222;
  color: #fff;
}

.chatInputArea button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #ff2d55;
  color: #fff;
}


.uploadCard{
  background:#111;
  padding:16px;
  border-radius:16px;
  box-shadow:0 0 15px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.inp{
  padding:12px;
  border-radius:10px;
  border:none;
  background:#1c1c1c;
  color:#fff;
}

.btn{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.primary{
  background:linear-gradient(45deg,#ff2d55,#ff6b81);
  color:#fff;
}

.secondary{
  background:#222;
  color:#fff;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  font-size:12px;
  color:#aaa;
  min-height:18px;
}

.uploadIconBtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  
  width: 90px;
  height: 90px;
  
  margin: 10px 0;
  
  border-radius: 18px;
  background: #1c1c1c;
  color: #ff2d55;
  
  cursor: pointer;
  transition: .3s;
  
  font-size: 22px;
  font-weight: 600;
}

.uploadIconBtn span {
  font-size: 12px;
  color: #aaa;
}

.uploadIconBtn:hover {
  background: #2a2a2a;
  transform: scale(1.05);
}

/* comment delete animation*/
.comment-item {
  transition: all 0.25s ease;
}

.comment-delete-anim {
  opacity: 0;
  transform: translateX(40px);
}

#emojibtns button{
  width:35px;
  height: 25px;
}
#emojibtns button:hover{
  height: 30px;
  background: #CCCCCC;
  border:none;
  border-radius:10px;
}



/*like comment button bottom height*/

.actionBar .btn {
  
  background: rgba(0, 0, 0, 0.6);
  
  border-radius: 25px;
  padding: 10px 14px;
  font-size: 14px;
  color: white;
  margin-bottom: 3.4rem;
}

.fadeOut {
  opacity: 0;
  transition: 0.5s;
}


/*toast message*/
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #111;
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 99999; /* 🔥 important */
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}



.pullRefresh {
  position: absolute;
  top: -60px;
  left: 0;
  width: 100%;
  text-align: center;
  color: rgba(255, 255, 255, 0.85);
  z-index: 20;
  transition: transform 0.25s var(--ease-smooth), top 0.25s var(--ease-smooth);
  font-weight: 500;
  font-size: 13px;
  
}



#previewBox,
#storyPreviewBox {
  max-height: 210px;
  overflow: hidden;
}

#previewImg,
#previewVideo,
#storyPreviewImg,
#storyPreviewVideo {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
}

#upload .card{
  overflow-y: auto;
  margin-bottom: 70px;
}


/*loader */
.refreshLoader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  
  display: flex;
  align-items: center;
  justify-content: center;
  
  background: rgba(0,0,0,0.25);
  z-index: 9999;
}

.refreshLoader.hidden {
  display: none;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top: 3px solid #fff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
/*settings*/
.profileHeader {
  position: absolute;
  top: 10px;
  right: 10px;
  left: 10px;
  display: flex;
  justify-content: flex-end;
  z-index: 100;
}

.settingsBtn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: white;
  font-size: 25px;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s ease;
}

.settingsBtn:active {
  transform: scale(0.92);
}

.profileMenu {
  position: absolute;
  top: 45px;
  right: 0;
  width: 160px;
  background: rgba(20,20,20,0.95);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  overflow: hidden;
  
  animation: menuPop 0.2s ease;
}

.profileMenu div {
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}

.profileMenu div:hover {
  background: rgba(255,255,255,0.08);
}

.hidden {
  display: none;
}

@keyframes menuPop {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/*profile name changes hide*/
#ownerControls {
  display: none;
  margin-top: 12px;
  animation: uiIn 0.25s ease;
}

#ownerControls.show {
  display: block;
}

/*timer sound*/
.wave {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 20px;
}

.wave span {
  width: 3px;
  height: 6px;
  background: #ff2d55;
  border-radius: 3px;
  animation: waveAnim 1s infinite ease-in-out;
}

.wave span:nth-child(2){ animation-delay: 0.1s; }
.wave span:nth-child(3){ animation-delay: 0.2s; }
.wave span:nth-child(4){ animation-delay: 0.3s; }
.wave span:nth-child(5){ animation-delay: 0.4s; }

@keyframes waveAnim {
  0%,100% { height: 6px; }
  50% { height: 18px; }
}

/*delet button message*/
.delBtn {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 14px;
}

.delBtn:hover {
  background: #333;
}

.cancel {
  background: #ff2d55;
}

window.uploadVideo = async () => {
  const f = file.files[0];
  if (!f) return alert("Select file first");
  
  const btn = document.getElementById("uploadBtn");
  const status = document.getElementById("uploadStatus");
  
  btn.innerText = "Uploading...";
  btn.disabled = true;
  status.innerText = "Starting...";
  
  try {
    const isImg = f.type.startsWith("image");
    
    let thumbnail = "";
    
    // 🎥 THUMBNAIL
    if (!isImg) {
      status.innerText = "Generating thumbnail...";
      
      const video = document.createElement("video");
      video.src = URL.createObjectURL(f);
      video.muted = true;
      
      await new Promise((resolve) => {
        video.onloadeddata = () => {
          video.currentTime = Math.min(0.5, video.duration || 0.5);
        };
        
        video.onseeked = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 180;
            
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0);
            
            thumbnail = canvas.toDataURL("image/jpeg", 0.6);
          } catch (e) {
            console.log("Thumbnail error", e);
          }
          resolve();
        };
        
        setTimeout(resolve, 1500);
      });
    }
    
    status.innerText = "Uploading to server...";
    
    const fd = new FormData();
    fd.append("file", f);
    fd.append("upload_preset", "Fiveer");
    
    const url = isImg ?
      "https://api.cloudinary.com/v1_1/dlsfr0ies/image/upload" :
      "https://api.cloudinary.com/v1_1/dlsfr0ies/video/upload";
    
    const res = await fetch(url, {
      method: "POST",
      body: fd
    });
    
    if (!res.ok) throw new Error("Upload failed");
    
    const data = await res.json();
    if (!data.secure_url) throw new Error("No URL returned");
    
    status.innerText = "Saving post...";
    
    await addDoc(collection(db, "posts"), {
  user: auth.currentUser.email,
  uid: auth.currentUser.uid,
  caption: caption.value,
  photo: isImg ? data.secure_url : "",
  video: isImg ? "" : data.secure_url,
  thumbnail: thumbnail,
  type: isImg ? "post" : "reel", // 🔥 ADD THIS
  likes: 0,
  time: serverTimestamp()
});
    
    // ✅ SUCCESS (ONLY HERE)
    status.innerText = "Uploaded ✅";
    showToast("🎥 Video uploaded successfully");
    btn.innerText = "Upload Post";
    btn.disabled = false;
    
    file.value = "";
    caption.value = "";
    previewBox.style.display = "none";
    
    // ⏳ REMOVE AFTER 10s
    setTimeout(() => {
  status.classList.add("fadeOut");
  
  setTimeout(() => {
    status.innerText = "";
    status.classList.remove("fadeOut");
  }, 500);
  
}, 9000);
}catch (err) {
    console.error(err);
    
    status.innerText = "Upload failed ❌";
    btn.innerText = "Upload Post";
    btn.disabled = false;
    
    alert("Upload failed: " + err.message);
  }
};

const pq = query(collection(db, "posts"), orderBy("time", "desc"));

let REELS_MAP = new Map();
let REELS_LIST = [];

onSnapshot(pq, (s) => {
  
  const shouldSkipRender = skipNextPostsRefresh;
  
  s.docChanges().forEach(change => {
    
    const id = change.doc.id;
    const p = change.doc.data();
    
    // 🟢 ADD
    if (change.type === "added") {
      
      REELS_MAP.set(id, p);
      
      REELS_LIST.push({
        id,
        ...p,
        time: p.time?.seconds || 0
      });
      
      REELS_LIST.sort((a, b) => b.time - a.time);
      
      if (!shouldSkipRender) {
        addReelToDOM(id, p);
      }
    }
    
    // 🟡 UPDATE
    if (change.type === "modified") {
      const countEl = document.getElementById("like-" + id);
      if (countEl) countEl.innerText = p.likes || 0;
    }
    
    // 🔴 DELETE
    if (change.type === "removed") {
      
      REELS_MAP.delete(id);
      REELS_LIST = REELS_LIST.filter(r => r.id !== id);
      
      const el = document.getElementById("reel-" + id);
      if (el) el.remove();
    }
  });
  
  initAutoPlay();
});

function addReelToDOM(id, p) {
  
  const div = document.createElement("div");
  div.className = "reel";
  div.id = "reel-" + id;
  
  div.innerHTML = `
    <div class="heart"
      style="display:none;position:absolute;top:40%;left:45%;font-size:60px;z-index:9;">❤️</div>

    <video
      class="reelVideo"
      data-src="${p.video}"
      muted
      playsinline
      loop
      preload="none"
      onclick="toggleSound(this)"
      ondblclick="dblLike('${id}',${p.likes||0},this)">
    </video>

    <div class="overlay">

      <b>@${p.name || p.user.split("@")[0]}</b>
      <div>${p.caption || ""}</div>

      <div class="actionBar">

        <button class="btn"
        onclick="likePost('${id}')">
          ❤️ <span id="like-${id}">${p.likes || 0}</span>
        </button>

        <button class="btn"
        onclick="commentPost('${id}')">
          💬
        </button>

        ${
          auth.currentUser &&
          auth.currentUser.email === p.user
          ? `<button class="btn"
              onclick="delPost('${id}')">✖</button>`
          : ""
        }

      </div>

    </div>
  `;
  
  // 🔥 add on top (like Instagram)
  insertReelSorted(div, id);
}

function insertReelSorted(div, id) {
  
  const newItem = REELS_LIST.find(r => r.id === id);
  if (!newItem) return;
  
  // 🔥 If it's newest → ALWAYS put on top
  let isNewest = true;
  
  for (let r of REELS_LIST) {
    if (r.id !== id && (r.time || 0) > (newItem.time || 0)) {
      isNewest = false;
      break;
    }
  }
  
  if (isNewest) {
    reels.insertBefore(div, reels.firstChild);
    return;
  }
  
  // 🔥 Otherwise find correct position
  const children = reels.children;
  
  for (let i = 0; i < children.length; i++) {
    
    const el = children[i];
    const elId = el.id.replace("reel-", "");
    const existing = REELS_LIST.find(r => r.id === elId);
    
    if (!existing) continue;
    
    if ((newItem.time || 0) > (existing.time || 0)) {
      reels.insertBefore(div, el);
      return;
    }
  }
  
  // fallback (older item)
  reels.appendChild(div);
}

function formatTime(ts) {
  
  if (!ts) return "";
  
  let date;
  
  if (ts.toDate) {
    date = ts.toDate();
  } else {
    date = new Date(ts);
  }
  
  let h = date.getHours();
  let m = date.getMinutes();
  
  let ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  h = h ? h : 12;
  
  m = m < 10 ? "0" + m : m;
  
  return `${h}:${m} ${ampm}`;
}

function timeAgo(ts) {
  if (!ts) return "";
  
  let ms = 0;
  
  if (ts.toDate) {
    ms = ts.toDate().getTime();
  } else if (ts.seconds) {
    ms = ts.seconds * 1000;
  } else {
    ms = new Date(ts).getTime();
  }
  
  const diff = Math.floor((Date.now() - ms) / 1000);
  
  if (diff < 60) return diff + "s ago";
  
  const min = Math.floor(diff / 60);
  if (min < 60) return min + "m ago";
  
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h ago";
  
  const day = Math.floor(hr / 24);
  return day + "d ago";
}

const observer = new IntersectionObserver((entries) => {
  
  entries.forEach(entry => {
    
    const v = entry.target;
    
    if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
      
      // pause others
      document.querySelectorAll('.reelVideo').forEach(x => {
        if (x !== v) x.pause();
      });
      
      v.play().catch(() => {});
      
      // 🔥 AUTO SWITCH ACTIVE VIDEO
      activeReelVideo = v;
      
      syncReelAudio();
      
    } else {
      v.pause();
    }
    
  });
  
}, { threshold: [0.7] });

function muteAllExceptCurrent() {
  document.querySelectorAll('.reelVideo').forEach(v => {
    v.muted = !(reelsSound && v === activeReelVideo);
  });
}

//preload video
function preloadNextVideo(currentVideo) {
  const currentReel = currentVideo.closest(".reel");
  if (!currentReel) return;
  
  const nextReel = currentReel.nextElementSibling;
  if (!nextReel) return;
  
  const nextVideo = nextReel.querySelector(".reelVideo");
  
  // already loaded → skip
  if (!nextVideo || nextVideo.src) return;
  
  // 🔥 preload silently
  nextVideo.src = nextVideo.dataset.src;
  nextVideo.load();
}

//cloase watch video
function cleanupOldVideos(currentVideo) {
  document.querySelectorAll(".reelVideo").forEach(v => {
    if (v !== currentVideo) {
      const reel = v.closest(".reel");
      const currentReel = currentVideo.closest(".reel");

      const distance =
        Math.abs([...reel.parentNode.children].indexOf(reel) -
                 [...currentReel.parentNode.children].indexOf(currentReel));

      // keep only nearby videos
      if (distance > 2) {
        v.pause();
        v.removeAttribute("src");
        v.load();
      }
    }
  });
}

window.initAutoPlay = () => {
  
  if (reelObserver) reelObserver.disconnect();
  
  reelObserver = new IntersectionObserver((entries) => {
    
    entries.forEach(entry => {
      const v = entry.target;
      
      if (entry.isIntersecting && entry.intersectionRatio > 0.8) {
        
        // ✅ Load only once
        if (!v.src) {
          v.src = v.dataset.src;
          v.load();
        }
        
        // ✅ Pause ALL videos (fresh query, not stale list)
        document.querySelectorAll(".reelVideo").forEach(x => {
          if (x !== v) x.pause();
        });
        
        // ✅ Play current
        v.play().catch(() => {});

// 🔥 SET ACTIVE VIDEO (VERY IMPORTANT FIX)
activeReelVideo = v;

// 🔥 PRELOAD NEXT
preloadNextVideo(v);
cleanupOldVideos(v);

// ✅ KEEP SOUND STATE AFTER SCROLL
syncReelAudio();
        
      } else {
        v.pause();
      }
    });
    
  }, { threshold: [0.5, 0.8, 1] }); // smoother detection
  
  // ✅ Observe all videos
  document.querySelectorAll(".reelVideo").forEach(v => {
    reelObserver.observe(v);
  });
};

//auto detects load
let reelWatchdog;

window.startReelWatchdog = () => {
  
  clearInterval(reelWatchdog);
  
  reelWatchdog = setInterval(() => {
    
    const vids = document.querySelectorAll(".reelVideo");
    
    let activeVideo = null;
    
    vids.forEach(v => {
      
      const rect = v.getBoundingClientRect();
      
      const isVisible =
        rect.top < window.innerHeight * 0.6 &&
        rect.bottom > window.innerHeight * 0.2;
      
      if (isVisible && !activeVideo) {
        activeVideo = v;
      }
    });
    
    if (!activeVideo) return;
    
    const v = activeVideo;
    
    const isStuck =
      v.networkState === 3 || // network failure
      (v.paused && v.readyState < 3);
    
    if (isStuck) {
      
      const src = v.dataset.src || v.src;
      if (!src) return;
      
      v.pause();
      
      // lightweight recovery (no full destroy)
      v.currentTime = 0;
      
      setTimeout(() => {
        v.muted = !reelsSound;
        
        v.play().catch(() => {});
        
      }, 200);
    }
    
  }, 4000);
};

function getVisibleVideo() {
  const videos = document.querySelectorAll(".reelVideo");
  
  let bestVideo = null;
  let bestRatio = 0;
  
  videos.forEach(v => {
    const rect = v.getBoundingClientRect();
    
    const visibleHeight =
      Math.max(0,
        Math.min(rect.bottom, window.innerHeight) -
        Math.max(rect.top, 0)
      );
    
    const ratio = visibleHeight / rect.height;
    
    if (ratio > bestRatio) {
      bestRatio = ratio;
      bestVideo = v;
    }
  });
  
  return bestVideo;
}

function controlReelsPlayback() {
  
  const videos = document.querySelectorAll(".reelVideo");
  const active = getVisibleVideo();
  
  videos.forEach(v => {

  });
}

//reload all page


function initPullRefresh() {
  
  let startY = 0;
  let currentY = 0;
  let isPulling = false;
  
  const pull = document.getElementById("pullRefresh");
  if (!reels || !pull) return;
  
  reels.addEventListener("touchstart", e => {
    
    if (reels.scrollTop > 0) return;
    
    startY = e.touches[0].clientY;
    currentY = startY;
    isPulling = true;
  });
  
  reels.addEventListener("touchmove", e => {
    
    if (!isPulling) return;
    
    currentY = e.touches[0].clientY;
    let diff = currentY - startY;
    
    if (diff > 0) {
      
      e.preventDefault();
      
      reels.style.transform = `translateY(${diff * 0.5}px)`;
      pull.style.top = Math.min(diff - 50, 30) + "px";
      
      pull.innerText = diff > 80 ?
        "Release to refresh" :
        "↓ Refresh";
    }
    
  }, { passive: false });
  
  reels.addEventListener("touchend", () => {
    
    if (!isPulling) return;
    
    let diff = currentY - startY;
    
    reels.style.transform = "translateY(0)";
    pull.style.top = "-60px";
    
    if (diff > 80) {
      triggerRefresh();
    }
    isPulling = false;
  });
}


let unsubscribeReels = null;

function startReelsListener() {
  
  unsubscribeReels = onSnapshot(pq, (s) => {
    
    if (skipNextPostsRefresh) return;
    
    s.docChanges().forEach(change => {
      const id = change.doc.id;
      const p = change.doc.data();
      
      if (change.type === "added") {
        REELS_MAP.set(id, p);
        REELS_LIST.push({ id, ...p });
        addReelToDOM(id, p);
      }
      
      if (change.type === "modified") {
        const el = document.getElementById("like-" + id);
        if (el) el.innerText = p.likes || 0;
      }
      
      if (change.type === "removed") {
        REELS_MAP.delete(id);
        REELS_LIST = REELS_LIST.filter(r => r.id !== id);
        document.getElementById("reel-" + id)?.remove();
      }
    });
    
    // 🔥 autoplay after updates
    setTimeout(initAutoPlay, 200);
    
  });
}

function triggerRefresh() {
  
  const pull = document.getElementById("pullRefresh");
  const loader = document.getElementById("refreshLoader");
  
  // show loader
  if (loader) loader.classList.remove("hidden");
  
  if (pull) pull.innerText = "Refreshing...";
  
  if (unsubscribeReels) {
    unsubscribeReels();
    unsubscribeReels = null;
  }
  
  reels.innerHTML = "";
  REELS_LIST = [];
  REELS_MAP.clear();
  
  startReelsListener();
  
  setTimeout(() => {
    
    if (pull) pull.innerText = "↓ Refresh";
    
    // hide loader
    if (loader) loader.classList.add("hidden");
    
  }, 800);
}

//voice message 
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

const recordBtn = document.getElementById("recordBtn");

// 🎤 START RECORD
recordBtn.addEventListener("mousedown", startRecording);
recordBtn.addEventListener("touchstart", startRecording);

// 🛑 STOP RECORD
recordBtn.addEventListener("mouseup", stopRecording);
recordBtn.addEventListener("touchend", stopRecording);

async function startRecording(e) {
  e.preventDefault();
  
  if (isRecording) return;
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    
    mediaRecorder.ondataavailable = e => {
      audioChunks.push(e.data);
    };
    
    mediaRecorder.onstop = sendAudioMessage;
    
    mediaRecorder.start();
    isRecording = true;
    
    recordUI.style.display = "flex";
startTimer();
    
  } catch (err) {
    alert("Mic permission denied");
  }
}

function stopRecording(e) {
  e.preventDefault();
  
  if (!isRecording) return;
  
  mediaRecorder.stop();
  isRecording = false;
  
  recordUI.style.display = "none";
stopTimer();
recordTime.innerText = "0:00";
}



async function sendAudioMessage() {
  
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  
  const fd = new FormData();
  fd.append("file", blob);
  fd.append("upload_preset", "Fiveer");
  
  try {
    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dlsfr0ies/video/upload",
      {
        method: "POST",
        body: fd
      }
    );
    
    const data = await res.json();
    
    if (!data.secure_url) throw new Error("Upload failed");
    
    // 🔥 SEND TO FIRESTORE
    await addDoc(collection(db, "chat"), {
      uid: auth.currentUser.uid,
      u: auth.currentUser.email,
      name: profileName.innerText.trim(),
      audio: data.secure_url, // ✅ audio field
      seen: false,
      deletedFor: [], // 🔥 NEW
      deletedForEveryone: false,//NEW
      time: serverTimestamp()
    });
    
  } catch (err) {
    alert("Audio send failed");
  }
}

  <div style="padding:15px;display:flex;justify-content:space-between;align-items:center;">
    <h3 id="popupTitle" style="color:#fff;">Users</h3>
    <button onclick="closeUserPopup()" style="background:none;border:none;color:#fff;font-size:22px;">✕</button>
  </div>
  
  <div id="popupList"></div>
  
</div>



<!--vivers-->
<div id="viewer"
style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;justify-content:center;align-items:center;">

<button onclick="closeViewer()"
style="position:absolute;top:12px;right:18px;font-size:30px;background:none;border:none;color:#fff;z-index:2;">✕</button>



<video id="bigVideo"
controls
style="max-width:100%;max-height:100%;display:none;"></video>
<img id="bigImg"
style="max-width:100%;max-height:100%;display:none;"></div>
<!-- ADD after <body> tag -->
<div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999999;display:flex;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-family:Arial;transition:.6s;">
  
<div style="font-size:55px;">
<img src="/images/logo.jpg"style="height:60px; width:60px;border-radius:50%;object-fit:cover";>
</div>
<h1 style="margin-top:-5px;">Rizz</h1>
<i style="margin-top:5px;font-size:10px;color:orange;">Made By Pratik</i>
</div>
<div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;justify-content:center;align-items:center;flex-direction:column;padding:25px;gap:12px;">

<h1 style="color:#fff">Login</h1>

<input id="emailLogin" placeholder="Email"style="width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;max-width:340px;">
<input id="passLogin" type="password" placeholder="Password"
style="width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;max-width:340px;">

<button onclick="emailLoginFn()" style="width:100%;max-width:340px;padding:14px;border:none;border-radius:12px;background:#ff2d55;color:#fff;font-size:16px;">Login</button>
<button onclick="signupFn()" style="width:100%;max-width:340px;padding:14px;border:none;border-radius:12px;background:#222;color:#fff;font-size:16px;">Create Account</button>

<button onclick="login()" style="width:100%;max-width:340px;padding:14px;
border:none;border-radius:12px;background:#4285F4;color:#fff;font-size:16px;">Continue with Google</button>
</div>

<!--story-->
<div style="position:absolute;bottom:20px;left:15px;display:flex;align-items:center;gap:10px;z-index:5;">
  
  <img id="storyUserPic"
  style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
  
  <span id="storyUserName"
  style="color:#fff;font-weight:600;"></span>

</div>
<div id="storyViewer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;overflow:hidden;">
  
<button id="storyDeleteBtn"
onclick="deleteStory()"
style="position:absolute;bottom:20px;left:15px;z-index:5;background:#ff2d55;border:none;color:#fff;padding:8px 12px;border-radius:10px;display:none;">
× Delete
</button>
  <!-- Progress bars -->
  <div id="storyProgress" style="position:absolute;top:10px;left:0;width:100%;display:flex;gap:4px;padding:5px 8px;"></div>

  <!-- Close button -->
<button onclick="event.stopPropagation(); closeStory()" 
  style="position:absolute;top:18px;right:18px;font-size:26px;background:none;border:none;color:#fff;z-index:999;">
✕
</button>
    
    <!-- LEFT TAP (previous story) -->
<div onclick="nextStory(event)"
style="position:absolute;right:0;top:0;width:50%;height:100%;z-index:3;"></div>

<div onclick="prevStory(event)"
style="position:absolute;left:0;top:0;width:50%;height:100%;z-index:3;"></div>

<button id="soundBtn"
onclick="toggleStorySound()"
style="position:absolute;bottom:70px;right:15px;z-index:5;background:#111;color:#fff;border:none;padding:8px 12px;border-radius:10px;">
 🔇Sound OFF
</button>
<!--views-->
<button onclick="showStoryViews(event)"
style="position:absolute;bottom:20px;right:15px;background:#ff2d55;border:none;color:#fff;padding:8px 12px;border-radius:10px;">
👁 Views
</button>
  <!-- Story media -->
  <img id="storyImg" style="width:100%;height:100%;object-fit:cover;display:none;">
  <video id="storyVideo" style="width:100%;height:100%;object-fit:cover;display:none;" autoplay playsinline></video>

</body>
</html>
