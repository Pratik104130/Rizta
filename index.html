*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff;overflow:hidden;}

/* HEADER */
header{position:fixed;top:0;left:0;width:100%;height:56px;padding:10px 14px;background:rgba(0, 0, 0, 0.6);backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);border-bottom: 1px solid rgba(255, 255, 255, 0.08);z-index:50;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111;transition:.35s ease;}
header.hide{
transform:translateY(-100%);
opacity:.7;
}
header b{
animation:logoPulse 2s infinite;
}
@keyframes logoPulse{
50%{transform:scale(1.09);}
}
#topDp{width:34px;height:34px;border-radius:50%;object-fit:cover;}
/* PAGES */
.page{display:none;position:absolute;top:50px;left:0;width:100%;height:calc(100vh - 116px);overflow:auto;background:#000;animation: fadeInUp 0.4s ease forwards;transition: 0.35s ease;}
.page.show {opacity: 1;transform: translateY(0) scale(1);pointer-events: auto;}
@keyframes fadeInUp {from { opacity: 0; transform: translateY(20px); }to { opacity: 1; transform: none; }}
.show{display:block;}

@keyframes slide{from{transform:translateX(20px);opacity:.5}to{transform:translateX(0);opacity:1}}
/* STORIES */
#storiesBar{position:fixed;top:10px;left:0;width:100%;height:90px;display:flex;gap:14px;overflow-x:auto;padding:10px;background:#050505;z-index:30;border-top-right-radius: 20px;}

.story{min-width:72px;text-align:center;}

.storyRing{width:62px;height:62px;border-radius:50%;padding:2.3px;  animation: ringPulse 2s infinite ease-in-out;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
@keyframes ringPulse {0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,85,0.7);}
  70% { box-shadow: 0 0 0 12px rgba(255,45,85,0); }}
.storyRing img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000;}


.small{font-size:11px;color:#ccc;margin-top:4px;}
/* HOME */
#home {top: 146px;height: calc(100vh - 206px);overflow: hidden;}
#profile,#chat,#upload,#notify{top:56px;height:calc(100vh - 116px);}
.reelsWrap{height: 100%; overflow-y: scroll;scroll-snap-type: y mandatory;scroll-behavior: smooth;
-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;     scroll-snap-stop:always;}


.reel{height: 100%;position: relative;scroll-snap-align: start;       /* Snap to the top of each reel */scroll-snap-stop: always;flex-shrink: 0;animation:reelUp .3s ease;}
@keyframes reelUp{
from{
opacity:0;
transform:translateY(45px);
}
to{
opacity:1;
transform:none;
}
}
.reel video{width:100%;height:100%;object-fit:cover;}

.overlay{position:absolute;left:10px;right:10px;bottom:18px;animation:slideUp .4s ease;
}
@keyframes slideUp{
from{opacity:0;transform:translateY(23px);}
to{opacity:1;transform:none;}
}
.btn {
  border: none;
  padding: 9px 14px;
  border-radius: 14px;
  background: linear-gradient(45deg, #ff2d55, #ff0066, #ff6a00);
  color: #fff;
  margin-top: 6px;
  font-weight: 600;
  box-shadow: 0 0 16px rgba(255, 45, 85, .35);
  transition: .25s ease;
}

.btn:active {
  transform: scale(.94);
}

.card{background:#121212;margin:10px;padding:12px;border-radius:14px;animation: popIn 0.3s ease;
  position:relative;
overflow:hidden;
}

h3,b{
animation:textFade .45s ease;
}

@keyframes textFade{
from{
opacity:0;
letter-spacing:5px;
}
to{
opacity:1;
letter-spacing:0;
}
}
.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:60%;
height:100%;
}

.inp {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, .06);
  backdrop-filter: blur(12px);
  color: #fff;
  outline: none;
  border: 1px solid rgba(255, 255, 255, .05);
}

/* PROFILE */
.profileTop{text-align:center;padding:15px;}

.profileTop img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #ff2d55;}

#profileBig{
animation:profileGlow 3s infinite ease-in-out;
}

@keyframes profileGlow{
0%,100%{
box-shadow:0 0 0px #ff2d55;
}
50%{
box-shadow:0 0 24px #ff2d55;
}
}
.statRow{display:flex;justify-content:space-around;margin-top:10px;}
.statRow div{text-align:center;}

.nav span:active {

.postMini {aspect-ratio: 1/1;width: 100%;object-fit: cover;border-radius: 8px;}

.heart {animation: heartPop 0.6s ease;filter: drop-shadow(0 0 10px red);}


@keyframes popIn {from { transform: scale(0.5); opacity: 0; }to { transform: scale(1); opacity: 1; }}


#storyProgress div {

#storyProgress div span {

}

#storyViewer{
animation:zoomIn .25s ease;

@keyframes zoomIn{
from{opacity:0;transform:scale(.92);}
to{opacity:1;transform:scale(1);}
}

.small {
  font-size: 11px;
  color: #D2D2D2;
  margin-left: -7px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width:600px) {
  .overlay {

  }
  
  .nav {

#emojibtns button{

function formatTime(ts) {
  
  if (!ts) return "";
  
  let date;
  
  if (ts.toDate) {
    date = ts.toDate();
  } else {
    date = new Date(ts);
  }
  
  let h = date.getHours();
  let m = date.getMinutes();
  
  let ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  h = h ? h : 12;
  
  m = m < 10 ? "0" + m : m;
  
  return `${h}:${m} ${ampm}`;
}

function timeAgo(ts) {
  if (!ts) return "";
  
  let ms = 0;
  
  if (ts.toDate) {
    ms = ts.toDate().getTime();
  } else if (ts.seconds) {
    ms = ts.seconds * 1000;
  } else {
    ms = new Date(ts).getTime();
  }
  
  const diff = Math.floor((Date.now() - ms) / 1000);
  
  if (diff < 60) return diff + "s ago";
  
  const min = Math.floor(diff / 60);
  if (min < 60) return min + "m ago";
  
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h ago";
  
  const day = Math.floor(hr / 24);
  return day + "d ago";
}

window.initAutoPlay = () => {
  
  if (reelObserver) reelObserver.disconnect();
  
  const vids = document.querySelectorAll(".reelVideo");
  
  reelObserver = new IntersectionObserver((entries) => {
    
    entries.forEach(entry => {
      
      const v = entry.target;
      
      if (entry.isIntersecting && entry.intersectionRatio > 0.75) {
        
        // load only current reel
        if (!v.src) {
          v.src = v.dataset.src;
          v.load();
        }
        
        // sound mode
        if (reelsSound) {
          vids.forEach(x => x.muted = true);
          v.muted = false;
        } else {
          v.muted = true;
        }
        
        v.play().catch(() => {});
        
      } else {
        
        v.pause();
      }
      
    });
    
  }, { threshold: 0.75 });
  
  vids.forEach(v => reelObserver.observe(v));
};

window.startReelWatchdog = () => {
  
  clearInterval(reelWatchdog);
  
  reelWatchdog = setInterval(() => {
    
    const vids = document.querySelectorAll(".reelVideo");
    
    vids.forEach(v => {
      
      const rect = v.getBoundingClientRect();
      
      const visible =
        rect.top >= -100 &&
        rect.top < window.innerHeight * 0.7;
      
      if (!visible) return;
      
      // visible but not playing / stuck
      const stuck =
        v.paused ||
        v.readyState < 2 ||
        (v.currentTime === 0 && !v.ended);
      
      if (stuck) {
        
        const src = v.dataset.src || v.src;
        
        v.pause();
        v.removeAttribute("src");
        v.load();
        
        setTimeout(() => {
          
          v.src = src;
          v.load();
          
          v.muted = !reelsSound;
          
          v.play().catch(() => {});
          
        }, 300);
      }
      
    });
    
  }, 3500); // checks every 3.5 sec
};

//new upgrade trys

function getVisibleVideo() {
  const videos = document.querySelectorAll(".reelVideo");
  
  let bestVideo = null;
  let bestRatio = 0;
  
  videos.forEach(v => {
    const rect = v.getBoundingClientRect();
    
    const visibleHeight =
      Math.max(0,
        Math.min(rect.bottom, window.innerHeight) -
        Math.max(rect.top, 0)
      );
    
    const ratio = visibleHeight / rect.height;
    
    if (ratio > bestRatio) {
      bestRatio = ratio;
      bestVideo = v;
    }
  });
  
  return bestVideo;
}

function controlReelsPlayback() {
  
  const videos = document.querySelectorAll(".reelVideo");
  const active = getVisibleVideo();
  
  videos.forEach(v => {
    if (v === active) v.play().catch(() => {});
    else v.pause();
  });
}

function preloadNext() {
  
  const videos = document.querySelectorAll(".reelVideo");
  const active = getVisibleVideo();
  
  let found = false;
  
  videos.forEach(v => {
    if (found) {
      if (!v.dataset.loaded) {
        v.load();
        v.dataset.loaded = "1";
      }
      found = false;
    }
    
    if (v === active) found = true;
  });
}

window.addEventListener("scroll", () => {
  controlReelsPlayback();
  preloadNext();
});

style="position:absolute;top:12px;right:18px;font-size:30px;background:none;border:none;color:#fff;z-index:2;">✕</button>



<video id="bigVideo"
controls
style="max-width:100%;max-height:100%;display:none;"></video>
<img id="bigImg"
style="max-width:100%;max-height:100%;display:none;"></div>
<!-- ADD after <body> tag -->
<div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999999;display:flex;justify-content:center;align-items:center;flex-direction:column;color:#fff;font-family:Arial;transition:.6s;">
<div style="font-size:55px;">
<img src="/images/logo.jpg"style="height:60px; width:60px;border-radius:50%;object-fit:cover";>
</div>
<h1 style="margin-top:-5px;">Rizz</h1>
<i style="margin-top:5px;font-size:10px;color:orange;">Made By Pratik</i>
</div>
<div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;justify-content:center;align-items:center;flex-direction:column;padding:25px;gap:12px;">

<h1 style="color:#fff">Login</h1>

<input id="emailLogin" placeholder="Email"style="width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;max-width:340px;">
<input id="passLogin" type="password" placeholder="Password"
style="width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;max-width:340px;">

<button onclick="emailLoginFn()" style="width:100%;max-width:340px;padding:14px;border:none;border-radius:12px;background:#ff2d55;color:#fff;font-size:16px;">Login</button>
<button onclick="signupFn()" style="width:100%;max-width:340px;padding:14px;border:none;border-radius:12px;background:#222;color:#fff;font-size:16px;">Create Account</button>

<button onclick="login()" style="width:100%;max-width:340px;padding:14px;
border:none;border-radius:12px;background:#4285F4;color:#fff;font-size:16px;">Continue with Google</button>
</div>

<!--story-->
<div style="position:absolute;bottom:20px;left:15px;display:flex;align-items:center;gap:10px;z-index:5;">
  
  <img id="storyUserPic"
  style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
  
  <span id="storyUserName"
  style="color:#fff;font-weight:600;"></span>

</div>
<div id="storyViewer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;overflow:hidden;">
  
<button id="storyDeleteBtn"
onclick="deleteStory()"
style="position:absolute;bottom:20px;left:15px;z-index:5;background:#ff2d55;border:none;color:#fff;padding:8px 12px;border-radius:10px;display:none;">
× Delete
</button>
  <!-- Progress bars -->
  <div id="storyProgress" style="position:absolute;top:10px;left:0;width:100%;display:flex;gap:4px;padding:5px 8px;"></div>

  <!-- Close button -->
<button onclick="event.stopPropagation(); closeStory()" 
  style="position:absolute;top:18px;right:18px;font-size:26px;background:none;border:none;color:#fff;z-index:999;">
✕
</button>
    
    <!-- LEFT TAP (previous story) -->
<div onclick="nextStory(event)"
style="position:absolute;right:0;top:0;width:50%;height:100%;z-index:3;"></div>

<div onclick="prevStory(event)"
style="position:absolute;left:0;top:0;width:50%;height:100%;z-index:3;"></div>

<button id="soundBtn"
onclick="toggleStorySound()"
style="position:absolute;bottom:70px;right:15px;z-index:5;background:#111;color:#fff;border:none;padding:8px 12px;border-radius:10px;">
 🔇Sound OFF
</button>
<!--views-->
<button onclick="showStoryViews()" 
style="position:absolute;bottom:20px;right:15px;background:#ff2d55;border:none;color:#fff;padding:8px 12px;border-radius:10px;">
👁 Views
</button>
  <!-- Story media -->
  <img id="storyImg" style="width:100%;height:100%;object-fit:cover;display:none;">
  <video id="storyVideo" style="width:100%;height:100%;object-fit:cover;display:none;" autoplay playsinline></video>



</body>
</html>
